<!DOCTYPE html>
<html>
<head>
    <title>Socket Test</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>
    <h1>Socket Test</h1>
    <div id="logs"></div>
    
    <script>
        const socket = io('http://localhost:5000');
        const logs = document.getElementById('logs');
        
        function log(message) {
            logs.innerHTML += '<div>' + new Date().toLocaleTimeString() + ': ' + message + '</div>';
        }
        
        socket.on('connect', () => {
            log('✅ Connected to server');
            
            // Join cafe room (replace with your cafe ID)
            socket.emit('joinCafeRoom', 'your-cafe-id');
            log('🏪 Joined cafe room');
        });
        
        socket.on('newOrder', (order) => {
            log('🔔 New order: ' + order._id);
        });
        
        socket.on('autoPrintOrder', (orderData) => {
            log('🖨️ Auto-print order: ' + orderData.orderNumber);
        });
        
        socket.on('disconnect', () => {
            log('❌ Disconnected');
        });
    </script>
</body>
</html>
